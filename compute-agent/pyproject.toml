[project]
name = "jorge-agent"
version = "0.1.0"
description = "Compute Node Agent for MC-IaaS"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pyyaml",
    "passlib",
]

[project.optional-dependencies]
compute = [
    "libvirt-python",
]

dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "e2e: destructive tests against a real MC-IaaS Compute Node",
]
