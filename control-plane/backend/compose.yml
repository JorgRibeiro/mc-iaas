services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mc_iaas
      POSTGRES_USER: mc_iaas
      POSTGRES_PASSWORD: development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_iaas -d mc_iaas"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
